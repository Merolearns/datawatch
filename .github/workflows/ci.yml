name: ci

# Fast deterministic checks on pull requests and pushes to main. No secrets.
#
# Ruff is pinned to 0.16.10 — the version the code was verified clean
# against locally. No ruff config file exists in the repo; the binary's
# defaults are the rule set, so the version pin is what keeps CI and
# local identical. Do not bump the pin without re-running ruff locally.
#
# NOTE (Nov 13, 2026): workflow files cannot be pushed by API or git —
# the PATs lack the Workflows permission (a tree containing any
# .github/workflows/ path is refused with 403). This file was added in
# the repo web UI ("Add file" -> "Create new file"); edit it the same
# way. See deploy/CHECKLIST.md §1.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.10

      # Lint gate is F-only (pyflakes: unused imports, undefined names).
      # The F-only gate is green today and catches real bugs; do not widen
      # it until a style cleanup lands, or CI goes red on code this
      # workflow did not touch.
      - name: Lint (pyflakes rules only)
        run: ruff check --select F .

      - name: Run tests
        env:
          DATAWATCH_NO_SCHEDULER: "1"
        run: python -m pytest -q
