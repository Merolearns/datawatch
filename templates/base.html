<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataWatch — {% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a href="/" class="brand">DataWatch</a>
      <span class="tagline">data observability</span>
    </div>
    <nav class="topbar-right">
      {% if session.username %}
        <span class="user">{{ session.username }}</span>
        <a href="/alerts">Alerts{% if g.unread_alerts %} ({{ g.unread_alerts }}){% endif %}</a>
        <a href="/logout">Log out</a>
      {% else %}
        <a href="/login">Log in</a>
        <a href="/register">Sign up</a>
      {% endif %}
    </nav>
  </header>

  <main class="wrap">
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">
    DataWatch — define a contract, run it against your data, see what breaks.
  </footer>
</body>
</html>
